<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Church arch shape background -->
  <path d="M100 15 C70 15, 45 40, 45 70 L45 130 L155 130 L155 70 C155 40, 130 15, 100 15 Z" fill="none" stroke="#0A192F" stroke-width="4" opacity="0.6"/>
  
  <!-- Orbit ring 1 - Navy Blue (tilted left) -->
  <ellipse cx="100" cy="95" rx="60" ry="22" fill="none" stroke="#0A4F7C" stroke-width="5" transform="rotate(-40 100 95)"/>
  
  <!-- Orbit ring 2 - Gold (tilted right) -->
  <ellipse cx="100" cy="95" rx="60" ry="22" fill="none" stroke="#D4AF37" stroke-width="4" transform="rotate(40 100 95)"/>
  
  <!-- Orbit ring 3 - Silver/Gray (horizontal) -->
  <ellipse cx="100" cy="95" rx="58" ry="18" fill="none" stroke="#A0B0C4" stroke-width="3" opacity="0.8"/>
  
  <!-- Center golden dot -->
  <circle cx="100" cy="95" r="10" fill="#D4AF37"/>
  <circle cx="100" cy="95" r="6" fill="#B8902A"/>
  
  <!-- Letter I - bold navy -->
  <text x="100" y="102" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#0A192F" opacity="0.9">I</text>
  
  <!-- Top serif bar of I -->
  <rect x="82" y="60" width="36" height="6" rx="2" fill="#0A192F" opacity="0.9"/>
  <!-- Bottom serif bar of I -->
  <rect x="82" y="124" width="36" height="6" rx="2" fill="#0A192F" opacity="0.9"/>
  <!-- Vertical stem -->
  <rect x="95" y="60" width="10" height="70" fill="#0A192F" opacity="0.9"/>
</svg>
